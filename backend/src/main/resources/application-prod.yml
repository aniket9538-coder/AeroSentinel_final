spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

app:
  weather:
    backfill:
      enabled: false

logging:
  level:
    com.aerosentinel: INFO
    org.springframework.web: WARN

server:
  port: ${PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: aerosentinel-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:10000}
  forecast:
    ai:
      python-command: ${FORECAST_AI_PYTHON_COMMAND:python}
      cli-path: ${FORECAST_AI_CLI_PATH:ai-service/ml/inference/predict_forecast_cli.py}
      timeout-ms: ${FORECAST_AI_TIMEOUT_MS:30000}
  evidence:
    ai:
      python-command: ${EVIDENCE_AI_PYTHON_COMMAND:python}
      cli-path: ${EVIDENCE_AI_CLI_PATH:ai-service/ml/inference/orchestrate_evidence_cli.py}
      timeout-ms: ${EVIDENCE_AI_TIMEOUT_MS:15000}
  citizen:
    vision:
      python-command: ${CITIZEN_VISION_PYTHON_COMMAND:python}
      cli-path: ${CITIZEN_VISION_CLI_PATH:ai-service/ml/inference/vision_cli.py}
      timeout-ms: ${CITIZEN_VISION_TIMEOUT_MS:30000}
  external:
    cpcb:
      base-url: ${CPCB_BASE_URL:https://api.cpcb.gov.in}
      api-key: ${CPCB_API_KEY:}
    openaq:
      base-url: ${OPENAQ_BASE_URL:https://api.openaq.org/v3}
      api-key: ${OPENAQ_API_KEY:b094486bd6df343cfbc2a1f9c18b6fd40834dccd175347eece1acb4be6306766}
      timeout-ms: ${OPENAQ_TIMEOUT_MS:15000}
      enabled: ${OPENAQ_ENABLED:true}
    firms:
      base-url: ${FIRMS_BASE_URL:https://firms.modaps.eosdis.nasa.gov}
      api-key: ${FIRMS_API_KEY:}
    weather:
      open-meteo:
        base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
        timeout-ms: ${OPEN_METEO_TIMEOUT_MS:15000}
      base-url: ${WEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
      api-key: ${WEATHER_API_KEY:}
    warnings:
      official:
        base-url: ${OFFICIAL_WARNINGS_BASE_URL:https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml}
        timeout-ms: ${OFFICIAL_WARNINGS_TIMEOUT_MS:5000}
  assistant:
    timeout-ms: ${ASSISTANT_TIMEOUT_MS:10000}
    rate-limit:
      requests-per-minute: ${ASSISTANT_RATE_LIMIT_RPM:30}
      trusted-proxies: ${ASSISTANT_RATE_LIMIT_TRUSTED_PROXIES:}
  weather:
    ingestion:
      enabled: ${AEROSENTINEL_WEATHER_INGESTION_ENABLED:true}
      interval-ms: ${AEROSENTINEL_WEATHER_INGESTION_INTERVAL_MS:900000}
    backfill:
      enabled: ${AEROSENTINEL_WEATHER_BACKFILL_ENABLED:true}
  ingestion:
    enabled: ${AEROSENTINEL_INGESTION_ENABLED:false}
    interval-ms: ${AEROSENTINEL_INGESTION_INTERVAL_MS:300000}
    provider: ${AEROSENTINEL_PROVIDER:openaq}
  spatial:
    h3:
      resolution: ${AEROSENTINEL_H3_RESOLUTION:8}
  monitoring:
    priority:
      risk-weight: ${MONITORING_RISK_WEIGHT:0.45}
      uncertainty-weight: ${MONITORING_UNCERTAINTY_WEIGHT:0.30}
      distance-weight: ${MONITORING_DISTANCE_WEIGHT:0.25}
      uncertainty-max-interval-width: ${MONITORING_UNCERTAINTY_MAX_INTERVAL_WIDTH:20.0}
      distance-max-km: ${MONITORING_DISTANCE_MAX_KM:20.0}
      medium-threshold: ${MONITORING_MEDIUM_THRESHOLD:40}
      high-threshold: ${MONITORING_HIGH_THRESHOLD:70}

